- path: /segments/v1
  method: post
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/segments/methods/segments#create-segment-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { SegmentsService } from '@sailpoint/angular-sdk/segments';
        import { Segment } from '@sailpoint/angular-sdk/segments';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(SegmentsService);

          createSegmentV1(): void {
            const segment: Segment = {
              "owner" : {
                "name" : "support",
                "id" : "2c9180a46faadee4016fb4e018c20639",
                "type" : "IDENTITY"
              },
              "created" : "2020-01-01T00:00:00Z",
              "visibilityCriteria" : {
                "expression" : {
                  "children" : [ ],
                  "attribute" : "location",
                  "value" : {
                    "type" : "STRING",
                    "value" : "Austin"
                  },
                  "operator" : "EQUALS"
                }
              },
              "name" : "segment-xyz",
              "modified" : "2020-01-01T00:00:00Z",
              "description" : "This segment represents xyz",
              "active" : true,
              "id" : "0f11f2a4-7c94-4bf3-a2bd-742580fe3bde"
            }; // Segment
            this.api.createSegmentV1({ segment: segment }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
