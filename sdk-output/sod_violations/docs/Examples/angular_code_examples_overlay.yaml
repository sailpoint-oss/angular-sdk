- path: /violations/v1/{id}
  method: get
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/sod_violations/methods/sod-violations#get-violation-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { SODViolationsService } from '@sailpoint/angular-sdk/sod_violations';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(SODViolationsService);

          getViolationV1(): void {
            const id: string = '3e078865-55ed-43cf-b83c-85c58d2016e6'; // string
            const xSailPointExperimental: string = 'true'; // string
            this.api.getViolationV1({ id: id }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
