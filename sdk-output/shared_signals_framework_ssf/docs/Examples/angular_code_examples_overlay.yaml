- path: /ssf/v1/streams
  method: post
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/shared_signals_framework_ssf/methods/shared-signals-framework-ssf#create-stream-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { SharedSignalsFrameworkSSFService } from 'sailpoint-angular-sdk/shared_signals_framework_ssf';
        import { CreateStreamRequest } from 'sailpoint-angular-sdk/shared_signals_framework_ssf';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(SharedSignalsFrameworkSSFService);

          createStreamV1(): void {
            const createStreamRequest: CreateStreamRequest = {
              "delivery" : {
                "method" : "urn:ietf:rfc:8935",
                "endpoint_url" : "https://receiver.example.com/ssf/events",
                "authorization_header" : "Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
              },
              "description" : "Production event stream",
              "events_requested" : [ "https://schemas.openid.net/secevent/caep/event-type/session-revoked" ]
            }; // CreateStreamRequest
            this.api.createStreamV1({ createStreamRequest: createStreamRequest }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
