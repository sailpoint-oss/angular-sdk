- path: /auth-users/v1/{id}
  method: get
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/auth_users/methods/auth-users#get-auth-user-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { AuthUsersService } from '@sailpoint/angular-sdk/auth_users';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(AuthUsersService);

          getAuthUserV1(): void {
            const id: string = 'ef38f94347e94562b5bb8424a56397d8'; // string
            this.api.getAuthUserV1({ id: id }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
- path: /auth-users/v1/{id}
  method: patch
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/auth_users/methods/auth-users#patch-auth-user-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { AuthUsersService } from '@sailpoint/angular-sdk/auth_users';
        import { JsonPatchOperation } from '@sailpoint/angular-sdk/auth_users';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(AuthUsersService);

          patchAuthUserV1(): void {
            const id: string = 'ef38f94347e94562b5bb8424a56397d8'; // string
            const jsonPatchOperation: Array<JsonPatchOperation> = {
              "op" : "replace",
              "path" : "/description",
              "value" : "New description"
            }; // Array<JsonPatchOperation>
            this.api.patchAuthUserV1({ id: id, jsonPatchOperation: jsonPatchOperation }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
