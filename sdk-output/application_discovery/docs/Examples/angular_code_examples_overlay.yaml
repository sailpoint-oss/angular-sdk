        import { Component, inject } from '@angular/core';
        import { ApplicationDiscoveryService } from '@sailpoint/angular-sdk/application_discovery';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(ApplicationDiscoveryService);

          getDiscoveredApplicationsV1(): void {
            const limit: number = 250; // number
            const offset: number = 0; // number
            const detail: string = 'FULL'; // 'SLIM' | 'FULL'
            const filter: string = 'name eq "Okta" and description co "Okta" and discoverySource in ("csv", "Okta Saas")'; // string
            const sorters: string = 'name'; // string
            this.api.getDiscoveredApplicationsV1({  }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
