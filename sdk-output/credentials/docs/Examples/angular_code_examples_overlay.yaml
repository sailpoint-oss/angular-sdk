- path: /credentials/v1/{id}
  method: get
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/credentials/methods/credentials#get-credential-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { CredentialsService } from '@sailpoint/angular-sdk/credentials';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(CredentialsService);

          getCredentialV1(): void {
            const id: string = '3f8a2c1d-5b6e-4d7f-8a9b-0c1d2e3f4a5b'; // string
            const xSailPointExperimental: string = 'true'; // string
            this.api.getCredentialV1({ id: id }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
