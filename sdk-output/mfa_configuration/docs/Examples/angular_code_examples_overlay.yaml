- path: /mfa/v1/{method}/test
  method: get
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/mfa_configuration/methods/mfa-configuration#test-mfa-config-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { MFAConfigurationService } from '@sailpoint/angular-sdk/mfa_configuration';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(MFAConfigurationService);

          testMFAConfigV1(): void {
            const method: string = 'okta-verify'; // 'okta-verify' | 'duo-web'
            this.api.testMFAConfigV1({ method: method }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
