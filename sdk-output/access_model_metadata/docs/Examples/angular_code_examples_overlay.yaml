- path: /access-model-metadata/v1/attributes
  method: post
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/access_model_metadata/methods/access-model-metadata#create-access-model-metadata-attribute-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { AccessModelMetadataService } from '@sailpoint/angular-sdk/access_model_metadata';
        import { AttributeDTO } from '@sailpoint/angular-sdk/access_model_metadata';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(AccessModelMetadataService);

          createAccessModelMetadataAttributeV1(): void {
            const attributeDTO: AttributeDTO = {
              "multiselect" : false,
              "isAdhoc" : false,
              "values" : [ {
                "name" : "Public",
                "type" : "static",
                "value" : "public",
                "status" : "active"
              }, {
                "name" : "Public",
                "type" : "static",
                "value" : "public",
                "status" : "active"
              } ],
              "name" : "Privacy",
              "description" : "Specifies the level of privacy associated with an access item.",
              "type" : "governance",
              "objectTypes" : [ "entitlement" ],
              "key" : "iscPrivacy",
              "status" : "active"
            }; // AttributeDTO
            this.api.createAccessModelMetadataAttributeV1({ attributeDTO: attributeDTO }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
