- path: /peer-group-strategies/v1/{strategy}/identity-outliers
  method: get
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/iai_peer_group_strategies/methods/iai-peer-group-strategies#get-peer-group-outliers-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { IAIPeerGroupStrategiesService } from 'sailpoint-angular-sdk/iai_peer_group_strategies';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(IAIPeerGroupStrategiesService);

          getPeerGroupOutliersV1(): void {
            const strategy: string = 'entitlement'; // 'entitlement'
            const limit: number = 250; // number
            const offset: number = 0; // number
            const count: boolean = true; // boolean
            const xSailPointExperimental: string = 'true'; // string
            this.api.getPeerGroupOutliersV1({ strategy: strategy }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
