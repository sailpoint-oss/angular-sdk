- path: /intelligence/v1/response-actions
  method: post
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/intelligence/methods/intelligence#create-response-action-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { IntelligenceService } from '@sailpoint/angular-sdk/intelligence';
        import { Responseactioncreaterequest } from '@sailpoint/angular-sdk/intelligence';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(IntelligenceService);

          createResponseActionV1(): void {
            const responseactioncreaterequest: Responseactioncreaterequest = {
              "actionType" : "DISABLE_ACCOUNT",
              "identityType" : "HUMAN",
              "identityId" : "2c918085842e69ae018428c919680149",
              "accountIds" : [ "2c918085abc000000000000000000001" ],
              "context" : {
                "reason" : "Contain compromised account",
                "externalAlertId" : "CS-FALCON-12345",
                "source" : "CROWDSTRIKE",
                "operator" : "soc-analyst@customer.com"
              }
            }; // Responseactioncreaterequest
            this.api.createResponseActionV1({ responseactioncreaterequest: responseactioncreaterequest }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
