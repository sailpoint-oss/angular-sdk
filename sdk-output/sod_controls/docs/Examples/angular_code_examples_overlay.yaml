- path: /controls/v1
  method: post
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/sod_controls/methods/sod-controls#create-control-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { SODControlsService } from '@sailpoint/angular-sdk/sod_controls';
        import { Compensatingcontrolcreate } from '@sailpoint/angular-sdk/sod_controls';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(SODControlsService);

          createControlV1(): void {
            const compensatingcontrolcreate: Compensatingcontrolcreate = {
              "owner" : {
                "id" : "3e07886555ed43cfb83c85c58d2016e6",
                "type" : "IDENTITY"
              },
              "name" : "a name",
              "description" : "a description",
              "secondaryOwners" : [ {
                "id" : "943a7c57da334d07ba2454bf7fcf144f",
                "type" : "GOVERNANCE_GROUP"
              } ],
              "action" : "Workflow",
              "expiration" : "20d",
              "type" : "Mitigation",
              "justificationRequired" : true,
              "workflowID" : "3e07886555ed43cfb83c85c58d2016e6"
            }; // Compensatingcontrolcreate
            const xSailPointExperimental: string = 'true'; // string
            this.api.createControlV1({ compensatingcontrolcreate: compensatingcontrolcreate }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
