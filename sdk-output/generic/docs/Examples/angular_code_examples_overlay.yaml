- path: /{path}
  method: delete
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/generic/methods/generic#generic-delete
      source: |
        import { Component, inject } from '@angular/core';
        import { GenericService } from '@sailpoint/angular-sdk/generic';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(GenericService);

          genericDelete(): void {
            const path: string = 'accounts/v1'; // string
            const xSailPointExperimental: string = 'true'; // string
            this.api.genericDelete({ path: path }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
