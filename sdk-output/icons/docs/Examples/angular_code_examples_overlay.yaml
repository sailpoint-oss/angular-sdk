      source: |
        import { Component, inject } from '@angular/core';
        import { IconsService } from '@sailpoint/angular-sdk/icons';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(IconsService);

          setIconV1(): void {
            const objectType: string = 'application'; // 'application'
            const objectId: string = 'a291e870-48c3-4953-b656-fb5ce2a93169'; // string
            const image: Blob = BINARY_DATA_HERE; // Blob
            const xSailPointExperimental: string = 'true'; // string
            this.api.setIconV1({ objectType: objectType, objectId: objectId, image: image }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
