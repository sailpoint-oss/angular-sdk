- path: /devices/v1/{id}
  method: patch
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/devices/methods/devices#update-device-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { DevicesService } from '@sailpoint/angular-sdk/devices';
        import { JsonPatchOperation } from '@sailpoint/angular-sdk/devices';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(DevicesService);

          updateDeviceV1(): void {
            const id: string = '5be33d3e-c54d-4ed7-af73-2380543e8283'; // string
            const jsonPatchOperation: Array<JsonPatchOperation> = {
              "op" : "replace",
              "path" : "/description",
              "value" : "New description"
            }; // Array<JsonPatchOperation>
            const xSailPointExperimental: string = 'true'; // string
            this.api.updateDeviceV1({ id: id, jsonPatchOperation: jsonPatchOperation }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
