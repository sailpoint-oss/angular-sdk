- path: /criteria/v1/privilege
  method: post
  xCodeSample:
    - lang: Angular
      label: SDK_tools/sdk/angular/privilege_criteria/methods/privilege-criteria#create-custom-privilege-criteria-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { PrivilegeCriteriaService } from 'sailpoint-angular-sdk/privilege_criteria';
        import { CreatePrivilegeCriteriaRequest } from 'sailpoint-angular-sdk/privilege_criteria';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(PrivilegeCriteriaService);

          createCustomPrivilegeCriteriaV1(): void {
            const createPrivilegeCriteriaRequest: CreatePrivilegeCriteriaRequest = {
              "sourceId" : "c42c45d8d7c04d2da64d215cd8c32f21",
              "privilegeLevel" : "HIGH",
              "groups" : [ {
                "criteriaItems" : [ {
                  "ignoreCase" : true,
                  "values" : [ "admin", "superuser" ],
                  "targetType" : "group",
                  "operator" : "displayName"
                }, {
                  "ignoreCase" : true,
                  "values" : [ "admin", "superuser" ],
                  "targetType" : "group",
                  "operator" : "displayName"
                } ],
                "operator" : "AND"
              }, {
                "criteriaItems" : [ {
                  "ignoreCase" : true,
                  "values" : [ "admin", "superuser" ],
                  "targetType" : "group",
                  "operator" : "displayName"
                }, {
                  "ignoreCase" : true,
                  "values" : [ "admin", "superuser" ],
                  "targetType" : "group",
                  "operator" : "displayName"
                } ],
                "operator" : "AND"
              } ],
              "type" : "CUSTOM",
              "operator" : "AND"
            }; // CreatePrivilegeCriteriaRequest
            this.api.createCustomPrivilegeCriteriaV1({ createPrivilegeCriteriaRequest: createPrivilegeCriteriaRequest }).subscribe({
              next: (result) => console.log(result),
              error: (error) => console.error(error),
            });
          }
        }
