                    "name" : "Identity Locations",
                    "type" : "TERMS"
                  },
                  "metric" : {
                    "field" : "@access.name",
                    "name" : "Access Name Count",
                    "type" : "COUNT"
                  },
                  "subAggregation" : {
                    "filter" : {
                      "field" : "access.type",
                      "name" : "Entitlements",
                      "type" : "TERM",
                      "value" : "ENTITLEMENT"
                    },
                    "bucket" : {
                      "field" : "attributes.city",
                      "size" : 100,
                      "minDocCount" : 2,
                      "name" : "Identity Locations",
                      "type" : "TERMS"
                    },
                    "metric" : {
                      "field" : "@access.name",
                      "name" : "Access Name Count",
                      "type" : "COUNT"
                    },
                    "nested" : {
                      "name" : "id",
