      label: SDK_tools/sdk/angular/search/methods/search#search-aggregate-v1
      source: |
        import { Component, inject } from '@angular/core';
        import { SearchService } from 'sailpoint-angular-sdk/search';
        import { Search } from 'sailpoint-angular-sdk/search';

        @Component({ selector: 'app-example', template: '' })
        export class ExampleComponent {
          private readonly api = inject(SearchService);

          searchAggregateV1(): void {
            const search: Search = {
              "queryDsl" : {
                "match" : {
                  "name" : "john.doe"
                }
              },
              "aggregationType" : "DSL",
              "aggregationsVersion" : "",
              "query" : {
                "query" : "name:a*",
                "timeZone" : "America/Chicago",
                "fields" : "[\"firstName,lastName,email\"]",
