                "excludes" : [ "stacktrace" ],
                "includes" : [ "name", "displayName" ]
              },
              "indices" : [ "identities" ],
              "typeAheadQuery" : {
                "field" : "source.name",
                "size" : 100,
                "query" : "Work",
                "sortByValue" : true,
                "nestedType" : "access",
                "sort" : "asc",
                "maxExpansions" : 10
              },
              "textQuery" : {
                "contains" : true,
                "terms" : [ "The quick brown fox", "3141592", "7" ],
