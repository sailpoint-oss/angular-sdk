name: Publish SDK package to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC token for npm trusted publishing

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Node 24 bundles npm 11. Install and build on the bundled version. npm 12
      # denies package install scripts by default, which breaks the ng-packagr
      # build.
      - name: Install dependencies
        working-directory: sdk-output
        run: npm ci

      # sdk-output/dist is not committed, so the publishable package is built here.
      # The generated sources under sdk-output are committed, so this step needs
      # neither the API specifications nor Java.
      - name: Build the Angular package
        working-directory: sdk-output
        run: npm run build

      # The upgrade runs after the build, so the publish gets an npm that
      # supports trusted publishing and the build keeps the bundled npm.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # ng-packagr writes the real package manifest to sdk-output/dist/package.json,
      # including the `exports` map for all secondary entry points. Publish from
      # there, not from sdk-output.
      - name: Publish to npmjs
        working-directory: sdk-output/dist
        run: npm publish --provenance
